# Lenovo Z5 Pro GT - SM8150 (Snapdragon 855) - ALVO PRINCIPAL
# Ainda não bootou Linux de verdade. Dois caminhos possíveis:
#   halium:   kernel do LineageOS (dev do Telegram) + libhybris pros blobs do Android.
#             Reaproveita NFC, slider, câmera. É o caminho mais rápido.
#   mainline: kernel sm8150 do postmarketOS (gitlab.postmarketos.org/soc/qualcomm-sm8150/linux),
#             precisa escrever o device tree do aparelho do zero. Longo prazo.
DEVICE_NAME="Lenovo Z5 Pro GT (L78032)"
DEVICE_ARCH=aarch64
DEVICE_METHOD=halium

# TODO: preencher com o kernel source e o device tree do LineageOS do aparelho
KERNEL_URL=
KERNEL_CONFIG=
KERNEL_DTB=

# TODO: tirar os offsets do boot.img atual do Lineage:
#   python3 unpack_bootimg.py --boot_img boot.img
BOOT_PAGESIZE=
BOOT_BASE=
BOOT_KERNEL_OFFSET=
BOOT_RAMDISK_OFFSET=
BOOT_SECOND_OFFSET=
BOOT_TAGS_OFFSET=
BOOT_CMDLINE=
